schema_version: 1
bundle_id: bundle.bp-investor-review
book:
  title: 天使、VC投资：商业计划书筛选的底层逻辑
  author: 棋从断處生
  source_pack: BV1yidtBoEeK
entry:
  name: bp-investor-review
  description: 当用户要审核商业计划书BP、提炼融资亮点、检查融资预算与里程碑或现金跑道时使用。Review investor-facing pitch
    deck evidence, differentiation and fundraising assumptions. 不用于纯PPT美化、个人投资建议或股票估值。
  core_principles:
  - 逐模块写出筛选问题、证据、缺口和优先动作，先消除关键逻辑断点。
  - 区分共享市场条件与特有优势，验证优势之间如何互相强化及复制难度。
  - 用同一组业务驱动连接资金用途、月度现金、里程碑和不利情景。
  - 将事实、推断、假设分开；缺数据不虚构，讲者的数字不是通用阈值。
  out_of_scope:
  - 纯视觉排版或PPT制作；下载视频或转写音频。
  - 个人理财、证券交易、实时估值定价及法律尽调。
  stop_conditions:
  - 未提供BP时给待填框架，不宣称已审核；现金数据缺失时不报告确定跑道。
  - 不编造业绩、基金偏好、竞争优势或融资承诺。
  - 来源为单段视频的自动转写；案例是教学说明，没有经验证的真实投资结果。
